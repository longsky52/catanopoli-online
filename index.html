      };

      window.rispondiScambio = function (accepted) {
        closeModal();
        let data = window.tempTradeData;
        let targetName = players.find(function (p) {
          return String(p.id) === String(socket.id);
        }).name;
        socket.emit("tradeAnswer", {
          room: myRoom,
          targetId: socket.id,
          targetName: targetName,
          offerta: data.offerta,
          accepted: accepted,
        });
        avviaTimer("btn-pass", 10, fineTurnoProtetto);
      };

      window.buildFromInventory = function() {
        const mioP = players.find(function(pl) { return String(pl.id) === String(gameMode === "multi" ? socket.id : 0); });
        let mySelected = Array.from(document.querySelectorAll('input[id^="mycard-"]:checked')).map(function (cb) { return cb.value; });

        if (mySelected.length !== 1) {
          alert("Devi selezionare ESATTAMENTE UNA delle tue carte per poterci costruire sopra!");
          return;
        }

        let pos = mySelected[0];
        let prop = properties[pos];

        if (prop.group === "stazione" || prop.group === "societa") {
          alert("Non puoi costruire su Stazioni o Società!");
          return;
        }

        if (!hasMonopoly(mioP.id, prop.group)) {
          alert("Devi possedere TUTTI i terreni di questo colore per poter costruire!");
          return;
        }

        if (prop.houses >= 5) {
          alert("Hai già un Albergo qui! Spazio esaurito.");
          return;
        }

        if (mioP.money < prop.houseCost) {
          alert("Non hai abbastanza soldi! Costa " + prop.houseCost + "€.");
          return;
        }

        mioP.money -= prop.houseCost;
        prop.houses++;
        updateHousesDisplay(pos);
        updateTokens();

        if (gameMode === "multi" && socket) {
          socket.emit("syncAction", {
            room: myRoom,
            players: players,
            properties: properties,
            logMsg: mioP.name + " ha costruito su " + prop.name + "!"
          });
        }
        
        alert("Hai costruito con successo su " + prop.name + "!");
        closeModal();
        openInventoryAndTrade(); 
      };

      function closeModal() {
        document.getElementById("modal-overlay").style.display = "none";
      }

      let myPeer = null;
      let myAudioStream = null;

      function accendiMicrofono() {
        let btnMic = document.getElementById("btn-voice");

        // SE E' GIA' CONNESSO, FUNZIONA DA INTERRUTTORE ON/OFF (MUTO)
        if (myPeer && myAudioStream) {
          let audioTrack = myAudioStream.getAudioTracks()[0];
          audioTrack.enabled = !audioTrack.enabled; // Inverte lo stato (Muto/Smuto)
          
          if (audioTrack.enabled) {
            btnMic.style.background = "#3b7a3b";
            btnMic.style.borderColor = "#2a5a2a";
            btnMic.innerHTML = "🎤 AUDIO ON";
          } else {
            btnMic.style.background = "#bd2a2a";
            btnMic.style.borderColor = "#7a1515";
            btnMic.innerHTML = "🔇 MUTO";
          }
          return;
        }
        
        // PRIMA CONNESSIONE
        myPeer = new Peer({
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun2.l.google.com:19302' }
            ]
          }
        });

        navigator.mediaDevices
          .getUserMedia({ video: false, audio: true })
          .then(function (stream) {
            myAudioStream = stream;
            document.getElementById("game-log").innerHTML = "🎤 Microfono collegato!";

            if (btnMic) {
              btnMic.style.background = "#3b7a3b";
              btnMic.style.borderColor = "#2a5a2a";
              btnMic.innerHTML = "🎤 AUDIO ON";
            }

            myPeer.on("call", function (call) {
              call.answer(myAudioStream);
              call.on("stream", function (userAudioStream) {
                aggiungiAudioPlayer(call.peer, userAudioStream);
              });
            });

            myPeer.on("open", function (id) {
              if (socket) socket.emit("voiceReady", { room: myRoom, peerId: id });
            });
          })
          .catch(function (err) {
            alert("Devi dare il permesso al microfono se vuoi parlare in partita!");
            myPeer = null; // Resetta per permettere di riprovare
          });
      }

      function aggiungiAudioPlayer(peerId, stream) {
        if (!document.getElementById("audio-" + peerId)) {
          const audio = document.createElement("audio");
          audio.id = "audio-" + peerId;
          audio.srcObject = stream;
          audio.autoplay = true;
          audio.playsInline = true; 
          audio.controls = true;
          audio.style.width = "100%";
          audio.style.height = "30px";
          audio.style.marginTop = "5px";

          let container = document.getElementById("audio-container");
          container.style.display = "block";
          container.style.position = "absolute";
          container.style.top = "10px";
          container.style.left = "10px";
          container.style.zIndex = "999";
          container.style.background = "rgba(0,0,0,0.8)";
          container.style.padding = "5px";
          container.style.borderRadius = "8px";

          container.appendChild(audio);

          let playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.catch(function (e) {
              console.log(
                "Audio bloccato dal browser. Sblocco automatico al primo click.",
                e
              );
              // Sblocca al primo click sullo schermo
              document.addEventListener("click", function sbloccaAudio() {
                audio.play();
                document.removeEventListener("click", sbloccaAudio);
              });
            });
          }
        }
      }

      window.dichiaraBancarottaManuale = function () {
        if (
          !confirm(
            "Sei sicuro di voler dichiarare bancarotta e ritirarti dalla partita?"
          )
        )
          return;
        bloccaTimer();
        let mioP = players.find(function (pl) {
          return String(pl.id) === String(gameMode === "multi" ? socket.id : 0);
        });
        if (!mioP || mioP.bankrupt) return;

        mioP.bankrupt = true;
        mioP.money = -1; // Per sicurezza

        Object.keys(properties).forEach(function (k) {
          if (String(properties[k].owner) === String(mioP.id)) {
            properties[k].owner = null;
            properties[k].houses = 0;
            let tile = document.getElementById("tile-" + k);
            if (tile) tile.style.boxShadow = "none";
            let badge = tile ? tile.querySelector(".property-badge") : null;
            if (badge) badge.remove();
          }
        });
        updateTokens();

        let msg = "🏳️ <b>" + mioP.name + " SI È ARRESO (BANCAROTTA)!</b>";
        document.getElementById("game-log").innerHTML = msg;

        if (gameMode === "multi" && socket) {
          socket.emit("syncAction", {
            room: myRoom,
            players: players,
            properties: properties,
            logMsg: msg,
          });
          setTimeout(function () {
            socket.emit("endTurn", { room: myRoom });
          }, 2000);
        } else {
          setTimeout(function () {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            startTurnFlow();
          }, 2000);
        }
      };

      window.addEventListener("resize", function () {
        if (document.getElementById("game-ui").style.display === "flex")
          updateTokens();
      });
    </script>
  </body>
